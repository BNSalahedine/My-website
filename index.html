<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="referrer" content="no-referrer-when-downgrade" />
  <title>قنوات البث المباشر</title>
  <style>
    :root {
      --bg-color: #0b0f17;
      --card-bg: rgba(20, 27, 41, 0.92);
      --accent: #38bdf8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: rgba(148, 163, 184, 0.18);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Arabic", sans-serif;
      transition: background 0.35s ease;
    }

    .app-wrapper {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      gap: 14px;
    }

    .top-bar {
      width: 100%;
      max-width: 960px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 10px 16px;
      backdrop-filter: blur(10px);
    }

    .brand-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: transparent;
      border: none;
      color: var(--text-main);
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 10px;
    }

    .brand-logo {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--accent), #2563eb);
      display: grid;
      place-items: center;
      font-weight: 800;
      color: #fff;
      font-size: 15px;
    }

    .current-channel-badge {
      background: rgba(56, 189, 248, 0.14);
      color: var(--accent);
      border: 1px solid rgba(56, 189, 248, 0.35);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
    }

    .player-card {
      width: 100%;
      max-width: 960px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
    }

    .player-box {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
    }

    .player-box iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .channels-panel {
      width: 100%;
      max-width: 960px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 14px;
      backdrop-filter: blur(10px);
    }

    .channels-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 10px;
    }

    .channel-btn {
      background: rgba(15, 23, 42, 0.85);
      color: var(--text-main);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 11px 12px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
    }

    .channel-btn:hover {
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    .channel-btn.active {
      background: var(--accent);
      color: #06101d;
      border-color: var(--accent);
    }

    .hint-text {
      font-size: 12px;
      color: var(--text-muted);
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="app-wrapper" id="appWrapper">
    <div class="top-bar" id="topBar">
      <button type="button" class="brand-btn" id="logoMenuBtn" title="تبديل عرض قائمة القنوات">
        <span class="brand-logo">TV</span>
        <span>بث مباشر</span>
      </button>
      <div class="current-channel-badge" id="currentChannelName">NAT GEO AD</div>
    </div>

    <div class="player-card" id="playerCard">
      <div class="player-box">
        <iframe
          id="tvFrame"
          src="https://www.elahmad.ru/tv/radiant.php?id=natgeo_1"
          allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
          allowfullscreen
          referrerpolicy="no-referrer-when-downgrade"
        ></iframe>
      </div>
    </div>

    <div class="channels-panel" id="channelsPanel">
      <div class="channels-grid" id="channelsGrid"></div>
    </div>

    <div class="hint-text">انقر على المساحة الفارغة لتغيير الخلفية، أو اضغط على الشعار لإظهار/إخفاء القنوات</div>
  </div>

  <script>
    const channels = [
      { name: "NAT GEO AD", url: "https://www.elahmad.ru/tv/radiant.php?id=natgeo_1" },
      { name: "BEIN NEWS", url: "https://channel.aflam4you.net/playeraf.php?vid=31&aflam_s=1&aflam_k=forex121" },
      { name: "BEIN1", url: "https://channel.aflam4you.net/playeraf.php?vid=68&aflam_s=1&aflam_k=forex121" },
      { name: "BEIN2", url: "https://channel.aflam4you.net/playeraf.php?vid=2&aflam_s=1&aflam_k=forex121" },
      { name: "BEIN3", url: "https://channel.aflam4you.net/playeraf.php?vid=1&aflam_s=1&aflam_k=forex121" },
      { name: "BEIN4", url: "https://channel.aflam4you.net/playeraf.php?vid=3&aflam_s=1&aflam_k=forex121" },
      { name: "MBC ACTION", url: "https://channel.aflam4you.net/playeraf.php?vid=500&aflam_s=1&aflam_k=forex121" }
    ];

    const backgrounds = [
      "#0b0f17",
      "radial-gradient(circle at top, #172554, #090d16 70%)",
      "radial-gradient(circle at top, #064e3b, #090d16 70%)",
      "radial-gradient(circle at top, #4c1d95, #090d16 70%)",
      "radial-gradient(circle at top, #7c2d12, #090d16 70%)"
    ];

    let bgIndex = 0;
    const tvFrame = document.getElementById("tvFrame");
    const currentChannelName = document.getElementById("currentChannelName");
    const channelsGrid = document.getElementById("channelsGrid");
    const channelsPanel = document.getElementById("channelsPanel");
    const logoMenuBtn = document.getElementById("logoMenuBtn");
    const appWrapper = document.getElementById("appWrapper");

    function selectChannel(index, btnElement) {
      const ch = channels[index];
      if (!ch) return;
      tvFrame.src = ch.url;
      currentChannelName.textContent = ch.name;

      document.querySelectorAll(".channel-btn").forEach((el) => el.classList.remove("active"));
      if (btnElement) btnElement.classList.add("active");
    }

    channels.forEach((ch, idx) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "channel-btn" + (idx === 0 ? " active" : "");
      btn.textContent = ch.name;
      btn.addEventListener("click", (e) => {
        e.stopPropagation();
        selectChannel(idx, btn);
      });
      channelsGrid.appendChild(btn);
    });

    logoMenuBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      const isHidden = channelsPanel.style.display === "none";
      channelsPanel.style.display = isHidden ? "block" : "none";
    });

    appWrapper.addEventListener("click", (e) => {
      if (e.target === appWrapper) {
        bgIndex = (bgIndex + 1) % backgrounds.length;
        document.body.style.background = backgrounds[bgIndex];
      }
    });
  </script>
</body>
</html>
