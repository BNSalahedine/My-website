<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="referrer" content="origin-when-cross-origin" />
  <title>بث مباشر - صلاح الدين</title>
  <style>
    :root {
      --bg-color: #0b0f17;
      --card-bg: rgba(20, 27, 41, 0.94);
      --accent: #38bdf8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: rgba(148, 163, 184, 0.18);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Arabic", sans-serif;
      transition: background 0.35s ease;
    }

    .app-wrapper {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 14px;
      gap: 12px;
    }

    .top-bar, .player-card, .channels-panel {
      width: 100%;
      max-width: 960px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 18px;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
    }

    .brand-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: transparent;
      border: none;
      color: var(--text-main);
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .brand-logo {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--accent), #2563eb);
      display: grid;
      place-items: center;
      font-weight: 800;
      color: #fff;
    }

    .badge {
      background: rgba(56, 189, 248, 0.14);
      color: var(--accent);
      border: 1px solid rgba(56, 189, 248, 0.35);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
    }

    .player-card {
      overflow: hidden;
    }

    .player-box {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
    }

    .player-box iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .player-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 14px;
      border-top: 1px solid var(--border);
      font-size: 12px;
      color: var(--text-muted);
    }

    .action-btn {
      background: var(--accent);
      color: #06101d;
      text-decoration: none;
      font-weight: 800;
      font-size: 12px;
      padding: 8px 14px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
    }

    .channels-panel {
      padding: 14px;
    }

    .channels-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(135px, 1fr));
      gap: 10px;
    }

    .channel-btn {
      background: rgba(15, 23, 42, 0.85);
      color: var(--text-main);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 11px 12px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .channel-btn.active {
      background: var(--accent);
      color: #06101d;
      border-color: var(--accent);
    }

    .hint-text {
      font-size: 12px;
      color: var(--text-muted);
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="app-wrapper" id="appWrapper">
    <div class="top-bar">
      <button type="button" class="brand-btn" id="logoMenuBtn">
        <span class="brand-logo">TV</span>
        <span>بث مباشر</span>
      </button>
      <div class="badge" id="currentBadge">NAT GEO AD</div>
    </div>

    <div class="player-card">
      <div class="player-box">
        <iframe
          id="tvFrame"
          src="https://www.elahmad.ru/tv/radiant.php?id=natgeo_1"
          allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
          allowfullscreen
          webkitallowfullscreen
          mozallowfullscreen
          referrerpolicy="origin-when-cross-origin"
        ></iframe>
      </div>
      <div class="player-actions">
        <span id="statusHint">إذا لم يظهر الفيديو داخل الإطار بسبب حماية المصدر، اضغط على زر التشغيل الكامل.</span>
        <a class="action-btn" id="directOpenBtn" href="https://www.elahmad.ru/tv/radiant.php?id=natgeo_1" target="_self">
          تشغيل بملء الصفحة
        </a>
      </div>
    </div>

    <div class="channels-panel" id="channelsPanel">
      <div class="channels-grid" id="channelsGrid"></div>
    </div>

    <div class="hint-text">انقر على المساحة الفارغة لتغيير الخلفية، أو اضغط على الشعار لإخفاء/إظهار القنوات</div>
  </div>

  <script>
    const channels = [
      { name: "NAT GEO AD", url: "https://www.elahmad.ru/tv/radiant.php?id=natgeo_1" },
      { name: "BEIN NEWS", url: "https://channel.aflam4you.net/playeraf.php?vid=31&aflam_s=1&aflam_k=forex121" },
      { name: "BEIN1", url: "https://channel.aflam4you.net/playeraf.php?vid=68&aflam_s=1&aflam_k=forex121" },
      { name: "BEIN2", url: "https://channel.aflam4you.net/playeraf.php?vid=2&aflam_s=1&aflam_k=forex121" },
      { name: "BEIN3", url: "https://channel.aflam4you.net/playeraf.php?vid=1&aflam_s=1&aflam_k=forex121" },
      { name: "BEIN4", url: "https://channel.aflam4you.net/playeraf.php?vid=3&aflam_s=1&aflam_k=forex121" },
      { name: "MBC ACTION", url: "https://channel.aflam4you.net/playeraf.php?vid=500&aflam_s=1&aflam_k=forex121" }
    ];

    const backgrounds = [
      "#0b0f17",
      "radial-gradient(circle at top, #172554, #090d16 70%)",
      "radial-gradient(circle at top, #064e3b, #090d16 70%)",
      "radial-gradient(circle at top, #4c1d95, #090d16 70%)",
      "radial-gradient(circle at top, #7c2d12, #090d16 70%)"
    ];

    let bgIndex = 0;
    const tvFrame = document.getElementById("tvFrame");
    const directOpenBtn = document.getElementById("directOpenBtn");
    const currentBadge = document.getElementById("currentBadge");
    const channelsGrid = document.getElementById("channelsGrid");
    const channelsPanel = document.getElementById("channelsPanel");
    const logoMenuBtn = document.getElementById("logoMenuBtn");
    const appWrapper = document.getElementById("appWrapper");

    function selectChannel(index, btnEl) {
      const ch = channels[index];
      if (!ch) return;
      tvFrame.src = ch.url;
      directOpenBtn.href = ch.url;
      currentBadge.textContent = ch.name;
      document.querySelectorAll(".channel-btn").forEach((b) => b.classList.remove("active"));
      if (btnEl) btnEl.classList.add("active");
    }

    channels.forEach((ch, idx) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "channel-btn" + (idx === 0 ? " active" : "");
      btn.textContent = ch.name;
      btn.addEventListener("click", (e) => {
        e.stopPropagation();
        selectChannel(idx, btn);
      });
      channelsGrid.appendChild(btn);
    });

    logoMenuBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      channelsPanel.style.display = channelsPanel.style.display === "none" ? "block" : "none";
    });

    appWrapper.addEventListener("click", (e) => {
      if (e.target === appWrapper) {
        bgIndex = (bgIndex + 1) % backgrounds.length;
        document.body.style.background = backgrounds[bgIndex];
      }
    });
  </script>
</body>
</html>
